<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="description" content="Portal rasmi KESUPEN Sandakan — program, e-book, galeri dan maklumat KESUPEN.">
<meta name="theme-color" content="#0b1020">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | KESUPEN Sandakan</title>
  <link rel="icon" type="image/png" href="assets/images/kesupen-logo.png">
  <link rel="stylesheet" href="css/style.css">
<meta property="og:site_name" content="KESUPEN Sandakan">
<meta property="og:title" content="Gallery | KESUPEN Sandakan">
<meta property="og:description" content="Portal rasmi KESUPEN Sandakan.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://kesupensandakan.github.io/portalkesupensdkn/gallery.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="KESUPEN Sandakan | Portal Rasmi">
<meta name="twitter:description" content="Portal digital KESUPEN Sandakan — program, aktiviti, e-book dan galeri.">
<script type="application/ld+json">{
  "@context":"https://schema.org",
  "@type":"WebSite",
  "name":"KESUPEN Sandakan",
  "url":"https://kesupensandakan.github.io/portalkesupensdkn/",
  "inLanguage":"ms",
  "description":"Portal rasmi KESUPEN Sandakan — program, e-book, galeri dan maklumat KESUPEN."
}</script>
</head>
<body>
<header class="site-header premium-nav">
  <div class="container nav-wrap">
    <a class="brand" href="index.html" aria-label="KESUPEN Sandakan">
      <img class="brand-logo" src="assets/images/kesupen-logo.png" alt="Logo KESUPEN Sandakan">
      <span>KESUPEN<br><b>SANDAKAN</b></span>
    </a>
    <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Buka menu" aria-expanded="false">☰</button>
    <nav>
      <a href="index.html">UTAMA</a>
      <a href="programs.html">PROGRAM</a>
      <a href="gallery.html">GALERI</a>
      <a href="event.html?id=hari-keluarga-kesupen-sandakan-2026">E-BOOK</a>
      <a href="about.html">TENTANG</a>
      <a href="contact.html">HUBUNGI</a>
    </nav>
  </div>
</header>

<main class="page-reveal">
  <section class="hero compact">
    <div class="container">
      <p class="eyebrow">KESUPEN SANDAKAN</p>
      <h1>GALERI</h1>
      <p>Galeri disusun mengikut program supaya gambar setiap acara mudah dicari.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="albumGrid" class="gallery-albums"></div>
      <p id="galleryEmpty" class="muted" hidden>Belum ada gambar untuk album ini.</p>
    </div>
  </section>
</main>

<div id="lightbox" class="lightbox" hidden>
  <button id="lightboxClose" class="lightbox-close" aria-label="Tutup">×</button>
  <img id="lightboxImage" alt="">
</div>

<footer class="site-footer">
  <div class="container"><p>© 2026 KESUPEN Sandakan. Portal Program & Aktiviti.</p></div>
</footer>

<script src="js/app.js"></script>
<script src="js/gallery.js"></script>
<script>
const albumGrid = document.getElementById("albumGrid");
const galleryEmpty = document.getElementById("galleryEmpty");
const selectedEventId = new URLSearchParams(window.location.search).get("event");
const albums = selectedEventId
  ? KESUPEN_GALLERY.filter(album => album.eventId === selectedEventId)
  : KESUPEN_GALLERY;

const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const lightboxClose = document.getElementById("lightboxClose");

if (selectedEventId && albums.length) {
  const album = albums[0];
  document.title = `${album.title} | Galeri KESUPEN Sandakan`;
  const heading = document.querySelector(".hero.compact h1");
  const intro = document.querySelector(".hero.compact .container > p:not(.eyebrow)");
  if (heading) heading.textContent = album.title;
  if (intro) intro.textContent = "Dokumentasi gambar program ini dipaparkan dalam galeri.";

  // Untuk Galeri Program: terus paparkan semua gambar event.
  const images = Array.isArray(album.images) ? album.images.filter(Boolean) : [];
  if (!images.length) {
    galleryEmpty.hidden = false;
    galleryEmpty.textContent = "Belum ada gambar untuk program ini.";
  } else {
    albumGrid.innerHTML = `<div class="gallery-event-grid">${images.map((src, index) => `
      <button class="event-gallery-image" data-src="${src}" aria-label="Lihat gambar ${index + 1}">
        <img src="${src}" alt="${album.title} — gambar ${index + 1}" loading="lazy">
      </button>
    `).join("")}</div>`;
  }
} else {
  // Galeri utama biasa: kekalkan paparan album.
  if (!albums.length || !albums.some(album => album.images && album.images.length)) {
    galleryEmpty.hidden = false;
    galleryEmpty.textContent = "Belum ada gambar dalam galeri.";
  }

  albums.forEach(album => {
    const card = document.createElement("article");
    card.className = "gallery-album";
    const cover = album.cover
      ? `<img src="${album.cover}" alt="${album.title}" loading="lazy">`
      : `<div class="gallery-placeholder">TIADA GAMBAR</div>`;
    card.innerHTML = `
      <div class="gallery-cover">${cover}</div>
      <div class="gallery-album-body">
        <p class="eyebrow">${album.dateText}</p>
        <h2>${album.title}</h2>
        <p>${album.images.length} gambar</p>
        <div class="gallery-thumbs">
          ${album.images.map(src => `<button class="thumb" data-src="${src}" aria-label="Lihat gambar"><img src="${src}" alt="" loading="lazy"></button>`).join("")}
        </div>
      </div>
    `;
    albumGrid.appendChild(card);
  });
}

function openLightbox(src) {
  lightboxImage.src = src;
  lightbox.hidden = false;
  document.body.classList.add("lightbox-open");
}
function closeLightbox() {
  lightbox.hidden = true;
  lightboxImage.src = "";
  document.body.classList.remove("lightbox-open");
}

document.addEventListener("click", e => {
  const target = e.target.closest(".thumb, .event-gallery-image");
  if (target) openLightbox(target.dataset.src);
});
lightboxClose.addEventListener("click", closeLightbox);
lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });
</script>
</body>
</html>
